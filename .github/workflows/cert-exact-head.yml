name: Cert exact-head Keycloak validation

on:
  push:
    branches:
      - cert2/sdk-intake-exact-ci

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact pushed SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck openssh-client python3-yaml
      - name: Validate intended merge tree with certification harness excluded
        run: |
          set -Eeuo pipefail
          test -f .github/workflows/cert-exact-head.yml
          cp .github/workflows/cert-exact-head.yml /tmp/cert-exact-head.yml
          rm .github/workflows/cert-exact-head.yml
          test "$(git status --porcelain | wc -l)" -eq 1
          git status --porcelain | grep -Fx ' D .github/workflows/cert-exact-head.yml'
          ./scripts/validate.sh
          python3 scripts/validate-moneybee-oidc-contract.py
          python3 scripts/validate-source.py
          cp /tmp/cert-exact-head.yml .github/workflows/cert-exact-head.yml
          git diff --exit-code
          test -z "$(git status --porcelain)"
