name: Registration and recovery foundation

on:
  pull_request:
    paths:
      - "config/identity/browser-registration-policy.json"
      - "config/security/realm-security-policy.json"
      - "extensions/codestra-registration-gate/**"
      - "scripts/validate-browser-registration-policy.py"
      - "scripts/validate-realm-security-policy.py"
      - ".github/workflows/registration-recovery.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate fail-closed policies
        run: |
          python3 scripts/validate-browser-registration-policy.py
          python3 scripts/validate-realm-security-policy.py
      - name: Build supported registration provider
        run: |
          docker run --rm \
            --volume "$PWD/extensions/codestra-registration-gate:/src" \
            --workdir /src \
            maven:3.9.11-eclipse-temurin-21 \
            mvn --batch-mode --no-transfer-progress -DskipTests package
