name: One-shot repair for Keycloak PR authority validation

on:
  push:
    branches:
      - remediation/keycloak-pr-governance-20260903
    paths:
      - .github/workflows/one-shot-fix-pr69-validation.yml

permissions:
  contents: write

concurrency:
  group: keycloak-pr69-validation-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact repair commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Reconcile workflows and fail-closed validator
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          audit_workflow = '''name: Keycloak pull-request authority audit

          on:
            workflow_dispatch:
            schedule:
              - cron: "17 5 * * *"

          permissions:
            contents: read
            pull-requests: read
            checks: read

          concurrency:
            group: keycloak-pr-authority-audit
            cancel-in-progress: false

          jobs:
            audit:
              name: Keycloak / pull-request-authority
              runs-on: ubuntu-24.04
              timeout-minutes: 15
              steps:
                - name: Check out exact protected source
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                  with:
                    fetch-depth: 1
                    persist-credentials: false
                    ref: ${{ github.sha }}
                - name: Compile fail-closed auditor
                  run: python3 -m py_compile scripts/ci/audit_keycloak_pull_requests.py
                - name: Run unit regressions
                  run: python3 -m pytest -q tests/test_audit_keycloak_pull_requests.py
                - name: Audit every open and draft pull request
                  env:
                    GITHUB_TOKEN: ${{ github.token }}
                  run: |
                    python3 scripts/ci/audit_keycloak_pull_requests.py \
                      --json-output artifacts/keycloak-pr-audit.json \
                      --markdown-output artifacts/keycloak-pr-audit.md
                - name: Upload bounded audit evidence
                  uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
                  with:
                    name: keycloak-pr-audit-${{ github.sha }}
                    path: |
                      artifacts/keycloak-pr-audit.json
                      artifacts/keycloak-pr-audit.md
                    if-no-files-found: error
                    retention-days: 30
          '''

          pr_workflow = '''name: Keycloak exact-head PR gate

          on:
            pull_request:
              branches:
                - development
                - test
                - staging
                - production
                - main
              paths:
                - "scripts/ci/audit_keycloak_pull_requests.py"
                - "tests/test_audit_keycloak_pull_requests.py"
                - ".github/workflows/keycloak-pr-authority-*.yml"

          permissions:
            contents: read
            pull-requests: read
            checks: read

          concurrency:
            group: keycloak-exact-head-pr-gate-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
            cancel-in-progress: true

          jobs:
            audit:
              name: Keycloak / exact-head-pr-authority
              runs-on: ubuntu-24.04
              timeout-minutes: 15
              steps:
                - name: Check out exact proposed head
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                  with:
                    fetch-depth: 1
                    persist-credentials: false
                    ref: ${{ github.event.pull_request.head.sha }}
                - name: Compile fail-closed auditor
                  run: python3 -m py_compile scripts/ci/audit_keycloak_pull_requests.py
                - name: Run exact-head audit
                  env:
                    GITHUB_TOKEN: ${{ github.token }}
                  run: |
                    python3 scripts/ci/audit_keycloak_pull_requests.py \
                      --json-output artifacts/keycloak-pr-audit.json \
                      --markdown-output artifacts/keycloak-pr-audit.md
                - name: Upload bounded audit evidence
                  if: always()
                  uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
                  with:
                    name: keycloak-pr-audit-${{ github.event.pull_request.head.sha }}
                    path: |
                      artifacts/keycloak-pr-audit.json
                      artifacts/keycloak-pr-audit.md
                    if-no-files-found: ignore
                    retention-days: 30
          '''

          Path('.github/workflows/keycloak-pr-authority-audit.yml').write_text(
              audit_workflow, encoding='utf-8'
          )
          Path('.github/workflows/keycloak-pr-authority-pr.yml').write_text(
              pr_workflow, encoding='utf-8'
          )

          validator_path = Path('scripts/validate-workflows.py')
          validator = validator_path.read_text(encoding='utf-8')

          function_anchor = '\ndef validate() -> None:\n'
          if function_anchor not in validator:
              raise SystemExit('validator function anchor not found')

          validator_function = r'''
          def validate_pr_authority_workflow(path: Path, workflow: dict[str, Any]) -> None:
              """Validate read-only PR inventory workflows without granting runtime authority."""
              expected_permissions = {
                  "contents": "read",
                  "pull-requests": "read",
                  "checks": "read",
              }
              validate_permissions(
                  workflow.get("permissions"),
                  f"{path}.permissions",
                  expected_permissions,
              )

              jobs = as_mapping(workflow.get("jobs"), f"{path}.jobs")
              if set(jobs) != {"audit"}:
                  fail(f"{path}: PR authority workflow must contain only the audit job")
              job = as_mapping(jobs["audit"], f"{path}.jobs.audit")
              if "permissions" in job:
                  fail(f"{path}.jobs.audit: job-level permission overrides are prohibited")
              if "environment" in job:
                  fail(f"{path}.jobs.audit: protected Environments are not used by read-only audits")
              if normalize_runs_on(job.get("runs-on")) != ["ubuntu-24.04"]:
                  fail(f"{path}.jobs.audit: audit must use the isolated ubuntu-24.04 runner")
              if any(SECRET_EXPRESSION.search(text) for text in recursive_strings(job)):
                  fail(f"{path}.jobs.audit: audit must not reference repository secrets")
              validate_steps(job, f"{path}.jobs.audit")

              workflow_text = "\n".join(recursive_strings(workflow))
              for fragment in (
                  "scripts/ci/audit_keycloak_pull_requests.py",
                  "--json-output",
                  "--markdown-output",
                  "actions/upload-artifact",
                  "retention-days",
                  "github.token",
              ):
                  if fragment not in workflow_text:
                      fail(f"{path}: incomplete PR authority evidence path; missing {fragment}")

              triggers = as_mapping(workflow.get("on"), f"{path}.on")
              concurrency = as_mapping(workflow.get("concurrency"), f"{path}.concurrency")

              if path.name == "keycloak-pr-authority-pr.yml":
                  if set(triggers) != {"pull_request"}:
                      fail(f"{path}: exact-head audit must be pull_request-only")
                  pull_request = as_mapping(
                      triggers["pull_request"], f"{path}.on.pull_request"
                  )
                  branches = as_sequence(
                      pull_request.get("branches"), f"{path}.on.pull_request.branches"
                  )
                  expected_branches = [
                      "development",
                      "test",
                      "staging",
                      "production",
                      "main",
                  ]
                  if branches != expected_branches:
                      fail(
                          f"{path}: expected protected promotion branches "
                          f"{expected_branches}, found {branches}"
                      )
                  paths = as_sequence(
                      pull_request.get("paths"), f"{path}.on.pull_request.paths"
                  )
                  expected_paths = [
                      "scripts/ci/audit_keycloak_pull_requests.py",
                      "tests/test_audit_keycloak_pull_requests.py",
                      ".github/workflows/keycloak-pr-authority-*.yml",
                  ]
                  if paths != expected_paths:
                      fail(f"{path}: exact-head audit path boundary changed")
                  if "github.event.pull_request.head.sha" not in workflow_text:
                      fail(f"{path}: checkout and evidence must bind to the exact PR head SHA")
                  if concurrency.get("cancel-in-progress") != "true":
                      fail(f"{path}: superseded exact-head audits must be cancelled")
                  steps = as_sequence(job.get("steps"), f"{path}.jobs.audit.steps")
                  upload_steps = [
                      as_mapping(step, f"{path}.jobs.audit.steps")
                      for step in steps
                      if isinstance(step, dict)
                      and str(step.get("uses", "")).startswith("actions/upload-artifact@")
                  ]
                  if len(upload_steps) != 1 or upload_steps[0].get("if") != "always()":
                      fail(f"{path}: exact-head audit evidence must upload with always()")
              elif path.name == "keycloak-pr-authority-audit.yml":
                  if set(triggers) != {"workflow_dispatch", "schedule"}:
                      fail(f"{path}: repository audit must be manual and scheduled only")
                  schedule = as_sequence(triggers["schedule"], f"{path}.on.schedule")
                  if len(schedule) != 1:
                      fail(f"{path}: exactly one bounded audit schedule is required")
                  schedule_item = as_mapping(schedule[0], f"{path}.on.schedule[0]")
                  if schedule_item != {"cron": "17 5 * * *"}:
                      fail(f"{path}: audit schedule changed without review")
                  if "github.sha" not in workflow_text:
                      fail(f"{path}: scheduled audit checkout must bind to github.sha")
                  if concurrency.get("cancel-in-progress") != "false":
                      fail(f"{path}: scheduled audits must preserve an active evidence run")
              else:
                  fail(f"Unsupported PR authority workflow: {path.name}")
          '''

          validator_function = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in validator_function.splitlines()
          ) + '\n'

          if 'def validate_pr_authority_workflow(' not in validator:
              validator = validator.replace(
                  function_anchor,
                  '\n' + validator_function + function_anchor,
                  1,
              )

          old_expected = (
              '    expected_names = {"validate.yml", "runtime-preflight.yml", '
              '"deploy.yml", "drift-review.yml"}\n'
          )
          new_expected = '''    expected_names = {
              "validate.yml",
              "runtime-preflight.yml",
              "deploy.yml",
              "drift-review.yml",
              "keycloak-pr-authority-audit.yml",
              "keycloak-pr-authority-pr.yml",
          }
          '''
          new_expected = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in new_expected.splitlines()
          ) + '\n'
          if old_expected not in validator:
              raise SystemExit('validator workflow inventory anchor not found')
          validator = validator.replace(old_expected, new_expected, 1)

          old_dispatch = '''        if path.name == "validate.yml":
                      validate_source_workflow(path, workflow)
                  else:
                      validate_privileged_workflow(path, workflow)
          '''
          old_dispatch = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in old_dispatch.splitlines()
          ) + '\n'
          new_dispatch = '''        if path.name == "validate.yml":
                      validate_source_workflow(path, workflow)
                  elif path.name in {
                      "keycloak-pr-authority-audit.yml",
                      "keycloak-pr-authority-pr.yml",
                  }:
                      validate_pr_authority_workflow(path, workflow)
                  else:
                      validate_privileged_workflow(path, workflow)
          '''
          new_dispatch = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in new_dispatch.splitlines()
          ) + '\n'
          if old_dispatch not in validator:
              raise SystemExit('validator dispatch anchor not found')
          validator = validator.replace(old_dispatch, new_dispatch, 1)

          validator_path.write_text(validator, encoding='utf-8')
          PY

          python3 -m py_compile scripts/validate-workflows.py scripts/ci/audit_keycloak_pull_requests.py
          git rm -- .github/workflows/one-shot-fix-pr69-validation.yml
          git add -- \
            .github/workflows/keycloak-pr-authority-audit.yml \
            .github/workflows/keycloak-pr-authority-pr.yml \
            scripts/validate-workflows.py
          git diff --cached --check
          git config user.name 'codestra-keycloak-ci-repair'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ci): validate read-only PR authority workflows'
          git push origin "HEAD:refs/heads/remediation/keycloak-pr-governance-20260903"
