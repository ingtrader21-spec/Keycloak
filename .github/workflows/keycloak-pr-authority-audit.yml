name: Keycloak pull-request authority audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: keycloak-pr-authority-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Keycloak / pull-request-authority
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact protected source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Compile fail-closed auditor
        run: python3 -m py_compile scripts/ci/audit_keycloak_pull_requests.py
      - name: Run unit regressions
        run: python3 -m pytest -q tests/test_audit_keycloak_pull_requests.py
      - name: Audit every open and draft pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/audit_keycloak_pull_requests.py \
            --json-output artifacts/keycloak-pr-audit.json \
            --markdown-output artifacts/keycloak-pr-audit.md
      - name: Upload bounded audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keycloak-pr-audit-${{ github.sha }}
          path: |
            artifacts/keycloak-pr-audit.json
            artifacts/keycloak-pr-audit.md
          if-no-files-found: error
          retention-days: 30
