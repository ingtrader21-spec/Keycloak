name: One-shot build validated Keycloak main-development merge

on:
  push:
    branches:
      - remediation/keycloak-main-development-merge-20260903
    paths:
      - .github/workflows/one-shot-build-main-development-merge.yml

permissions:
  contents: write

concurrency:
  group: keycloak-main-development-reconciliation-20260903
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_MAIN_SHA: 3d8cd0483a178100b679b2c3f0f4d4ca36fe161c
      EXPECTED_DEVELOPMENT_SHA: 18c130af174dc791222355fa6178422bd6cb30d2
      EXPECTED_MERGE_BASE: 92ca388323db23c1f308ce4e33d9f36b0c77c74e
      TARGET_BRANCH: sync/main-development-reconciled-20260903
      EVIDENCE_PATH: docs/governance/KEYCLOAK_MAIN_DEVELOPMENT_RECONCILIATION_2026-09-03.md
    steps:
      - name: Check out exact analysis trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Build and validate protected-main reconciliation
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/development:refs/remotes/origin/development"

          actual_main="$(git rev-parse refs/remotes/origin/main)"
          actual_development="$(git rev-parse refs/remotes/origin/development)"
          actual_merge_base="$(git merge-base "$actual_main" "$actual_development")"
          [[ "$actual_main" == "$EXPECTED_MAIN_SHA" ]] || {
            echo "ERROR=main_moved expected=$EXPECTED_MAIN_SHA actual=$actual_main" >&2
            exit 1
          }
          [[ "$actual_development" == "$EXPECTED_DEVELOPMENT_SHA" ]] || {
            echo "ERROR=development_moved expected=$EXPECTED_DEVELOPMENT_SHA actual=$actual_development" >&2
            exit 1
          }
          [[ "$actual_merge_base" == "$EXPECTED_MERGE_BASE" ]] || {
            echo "ERROR=merge_base_changed expected=$EXPECTED_MERGE_BASE actual=$actual_merge_base" >&2
            exit 1
          }
          if git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" >/dev/null 2>&1; then
            echo "ERROR=target_branch_already_exists branch=$TARGET_BRANCH" >&2
            exit 1
          fi

          development_unique_count="$(git rev-list --count "$EXPECTED_MAIN_SHA..$EXPECTED_DEVELOPMENT_SHA")"
          main_unique_count="$(git rev-list --count "$EXPECTED_DEVELOPMENT_SHA..$EXPECTED_MAIN_SHA")"
          [[ "$development_unique_count" == 30 ]] || {
            echo "ERROR=development_unique_commit_count_changed actual=$development_unique_count" >&2
            exit 1
          }
          [[ "$main_unique_count" == 19 ]] || {
            echo "ERROR=main_unique_commit_count_changed actual=$main_unique_count" >&2
            exit 1
          }

          mapfile -t development_paths < <(
            git diff --name-only "$EXPECTED_MAIN_SHA...$EXPECTED_DEVELOPMENT_SHA" | sort
          )
          ((${#development_paths[@]} == 49)) || {
            echo "ERROR=development_delta_inventory_changed actual=${#development_paths[@]}" >&2
            printf '%s\n' "${development_paths[@]}" >&2
            exit 1
          }

          required_obsolete_paths=(
            config/clients/grafana-observability.json
            config/clients/superset-analytics.json
            config/clients/openbao-secrets.json
            config/policy/managed-realm-roles.json
            config/policy/creatable-realm-roles.json
            config/policy/secret-export-clients.json
            scripts/observability_identity_policy.py
            scripts/protected_identity_engine.py
            scripts/validate-observability-managed-identities.py
            scripts/validate-observability-oidc-contract.py
            scripts/validate-source.py
          )
          for path in "${required_obsolete_paths[@]}"; do
            printf '%s\n' "${development_paths[@]}" | grep -Fx -- "$path" >/dev/null || {
              echo "ERROR=expected_development_overlay_path_missing path=$path" >&2
              exit 1
            }
          done

          # The development-only history is retained as the second parent, but its tree
          # is superseded by current protected main. This prevents the older live-capable
          # observability overlay and reduced wrapper scripts from replacing the current
          # repository-only desired-state model and hardened plan/apply controls.
          git checkout --detach "$EXPECTED_MAIN_SHA"
          git config user.name 'codestra-keycloak-reconciler'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git merge --strategy=ours --no-commit "$EXPECTED_DEVELOPMENT_SHA"

          mkdir -p "$(dirname "$EVIDENCE_PATH")"
          cat > "$EVIDENCE_PATH" <<EOF
          # Keycloak main-to-development authority reconciliation

          Date: 2026-09-03

          ## Exact ancestry

          \`\`\`text
          protected_main_sha=$EXPECTED_MAIN_SHA
          previous_development_sha=$EXPECTED_DEVELOPMENT_SHA
          merge_base_sha=$EXPECTED_MERGE_BASE
          protected_main_unique_commits=$main_unique_count
          development_unique_commits=$development_unique_count
          development_delta_paths=${#development_paths[@]}
          target_branch=$TARGET_BRANCH
          tree_authority=protected main
          history_preserved=true
          force_update=false
          \`\`\`

          ## Resolution

          The development-only history is preserved as the merge commit's second parent,
          but its tree is intentionally superseded by current protected \`main\`.

          Repository comparison showed that all 30 development-only commits belong to an
          older observability managed-identity implementation. That overlay attempted to
          place Grafana, Superset, and OpenBao browser clients into live-capable managed and
          creatable policies, while current protected \`main\` intentionally keeps those
          identities repository-only, requires MFA for every bound role, uses OpenBao-backed
          runtime secret files, and sets \`liveApplyAuthorized=false\`.

          The old development overlay also replaced the hardened plan, review, apply,
          rollback-evidence, and plan-gate scripts with small wrappers around a parallel
          engine. Keeping both authorities produced contradictory policies and failed the
          repository's own validators. The protected-main tree is therefore retained as
          the single source of truth; commit ancestry remains auditable and no branch is
          force-updated.

          ## Required follow-up

          This merge commit must enter \`development\` through a reviewed pull request.
          Afterward, feature branches must rebase on the reconciled development head and
          pass exact-head source and merge-result validation. This source reconciliation
          does not authorize a live realm plan or apply.

          ## Safety

          \`\`\`text
          KEYCLOAK_RUNTIME_CONTACTED=false
          KEYCLOAK_RUNTIME_APPLY=false
          REALMS_CHANGED=0
          CLIENTS_CHANGED=0
          USERS_CHANGED=0
          SECRETS_READ=0
          SECRETS_WRITTEN=0
          TOKENS_ISSUED=0
          SSH_CHANGED=false
          DNS_CHANGED=false
          PRODUCTION_RUNTIME_CHANGED=false
          \`\`\`
          EOF
          sed -i 's/^          //' "$EVIDENCE_PATH"
          git add "$EVIDENCE_PATH"

          sudo apt-get update
          sudo apt-get install --yes jq shellcheck openssh-client python3-yaml

          python3 -m compileall -q scripts tests
          ./scripts/validate.sh
          TEST_KC_CLIENT_SECRET=test-only-secret ./scripts/test-plan-gate.sh
          ./scripts/test-runtime-preflight.sh
          shellcheck scripts/*.sh scripts/lib/*.sh
          git diff --cached --check

          git commit -m 'sync(identity): reconcile protected main into development'
          merge_sha="$(git rev-parse HEAD)"
          parents="$(git show -s --format=%P HEAD)"
          expected_parents="$EXPECTED_MAIN_SHA $EXPECTED_DEVELOPMENT_SHA"
          [[ "$parents" == "$expected_parents" ]] || {
            echo "ERROR=unexpected_merge_parents expected='$expected_parents' actual='$parents'" >&2
            exit 1
          }

          mapfile -t tree_delta < <(git diff --name-only "$EXPECTED_MAIN_SHA" "$merge_sha")
          [[ "${#tree_delta[@]}" == 1 && "${tree_delta[0]}" == "$EVIDENCE_PATH" ]] || {
            echo 'ERROR=reconciled_tree_not_equal_to_protected_main_plus_evidence' >&2
            printf '%s\n' "${tree_delta[@]}" >&2
            exit 1
          }

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          [[ "$remote_sha" == "$merge_sha" ]] || {
            echo "ERROR=remote_readback_mismatch expected=$merge_sha actual=$remote_sha" >&2
            exit 1
          }

          echo 'KEYCLOAK_MAIN_DEVELOPMENT_RECONCILIATION=PASS'
          echo "MERGE_SHA=$merge_sha"
          echo "PARENTS=$parents"
          echo "TARGET_BRANCH=$TARGET_BRANCH"
          echo 'TREE_EQUALS_PROTECTED_MAIN_PLUS_EVIDENCE=true'
          echo 'KEYCLOAK_RUNTIME_APPLY=false'
          echo 'SECRETS_READ=0'
          echo 'SSH_CHANGED=false'
          echo 'PRODUCTION_RUNTIME_CHANGED=false'
