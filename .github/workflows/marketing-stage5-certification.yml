name: Marketing Stage 5 Certification

on:
  pull_request:
    paths:
      - 'config/marketing-stage4-clients.json'
      - 'scripts/validate_marketing_identity.py'
      - '.github/workflows/marketing-stage5-certification.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_marketing_identity.py
