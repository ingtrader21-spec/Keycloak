name: One-shot port resolved Keycloak transaction safety

on:
  push:
    branches:
      - remediation/keycloak-pr16-port-builder-20260903
    paths:
      - .github/workflows/one-shot-port-pr16-transaction-safety-v2.yml

permissions:
  contents: write

concurrency:
  group: keycloak-pr16-resolved-transaction-safety-port-20260903
  cancel-in-progress: false

jobs:
  port:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AUTHORITY_SHA: 0dbb8ea3421a39df88e3e25224845e2742b731e4
      SOURCE_PARENT_SHA: 49d33b68a1ebf7c9de97049597583fe30a49a3ce
      SOURCE_SHA: a3e67178d062babf3390094202aee9688995209a
      TARGET_BRANCH: hardening/keycloak-transaction-safety-20260903
      WORKFLOW_CANDIDATE: docs/evidence/KEYCLOAK_DEPLOY_TRANSACTION_SAFETY_CANDIDATE.yml
      EVIDENCE_PATH: docs/governance/KEYCLOAK_TRANSACTION_SAFETY_PORT_2026-09-03.md
    steps:
      - name: Check out exact builder trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Three-way port resolved final PR tree and validate
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch --no-tags origin \
            "+refs/heads/sync/main-development-reconciled-20260903:refs/remotes/origin/sync/main-development-reconciled-20260903"
          [[ "$(git rev-parse refs/remotes/origin/sync/main-development-reconciled-20260903)" == "$AUTHORITY_SHA" ]] || {
            echo 'ERROR=authority_moved' >&2
            exit 1
          }
          git cat-file -e "${SOURCE_PARENT_SHA}^{commit}"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          [[ "$(git rev-parse "${SOURCE_SHA}^2")" == "$SOURCE_PARENT_SHA" ]] || {
            echo 'ERROR=source_second_parent_mismatch' >&2
            exit 1
          }
          if git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" >/dev/null 2>&1; then
            echo "ERROR=target_branch_exists branch=$TARGET_BRANCH" >&2
            exit 1
          fi

          mapfile -t source_paths < <(git diff --name-only "$SOURCE_PARENT_SHA" "$SOURCE_SHA" | sort)
          expected_paths=(
            .github/workflows/deploy.yml
            Makefile
            README.md
            docs/GITOPS.md
            docs/audits/KEYCLOAK_BASELINE_AUDIT.md
            scripts/apply-plan.sh
            scripts/test-plan-gate.sh
          )
          [[ "${source_paths[*]}" == "${expected_paths[*]}" ]] || {
            echo 'ERROR=resolved_source_inventory_changed' >&2
            printf 'actual=%s\n' "${source_paths[*]}" >&2
            exit 1
          }

          git checkout --detach "$AUTHORITY_SHA"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          merge_path() {
            local path="$1"
            local output_path="$2"
            mkdir -p "$tmp/current/$(dirname "$path")" \
              "$tmp/base/$(dirname "$path")" \
              "$tmp/incoming/$(dirname "$path")" \
              "$(dirname "$output_path")"
            git show "$AUTHORITY_SHA:$path" >"$tmp/current/$path"
            git show "$SOURCE_PARENT_SHA:$path" >"$tmp/base/$path"
            git show "$SOURCE_SHA:$path" >"$tmp/incoming/$path"
            set +e
            git merge-file -p \
              "$tmp/current/$path" \
              "$tmp/base/$path" \
              "$tmp/incoming/$path" >"$tmp/merged"
            rc=$?
            set -e
            if ((rc != 0)); then
              echo "ERROR=three_way_merge_conflict path=$path rc=$rc" >&2
              grep -nE -B4 -A8 '^(<<<<<<<|=======|>>>>>>>)' "$tmp/merged" || true
              exit 1
            fi
            grep -nE '^(<<<<<<<|=======|>>>>>>>)' "$tmp/merged" && {
              echo "ERROR=merge_markers_present path=$path" >&2
              exit 1
            }
            install -m 0644 "$tmp/merged" "$output_path"
          }

          merge_path Makefile Makefile
          merge_path README.md README.md
          merge_path docs/GITOPS.md docs/GITOPS.md
          merge_path scripts/apply-plan.sh scripts/apply-plan.sh
          chmod 0755 scripts/apply-plan.sh
          merge_path scripts/test-plan-gate.sh scripts/test-plan-gate.sh
          chmod 0755 scripts/test-plan-gate.sh
          merge_path .github/workflows/deploy.yml "$WORKFLOW_CANDIDATE"
          git show "$SOURCE_SHA:docs/audits/KEYCLOAK_BASELINE_AUDIT.md" \
            >docs/audits/KEYCLOAK_BASELINE_AUDIT.md

          for token in \
            '--recovery-dir' \
            'recovery-manifest.json' \
            'operation-events.ndjson' \
            'PARTIAL_APPLY=true' \
            'rollback-required' \
            'Immediate pre-write state changed'; do
            grep -F -- "$token" scripts/apply-plan.sh >/dev/null || {
              echo "ERROR=transaction_safety_token_missing token=$token" >&2
              exit 1
            }
          done
          for token in \
            '--review' \
            '--expected-review-sha' \
            'Independent drift-review evidence is invalid'; do
            grep -F -- "$token" scripts/apply-plan.sh >/dev/null || {
              echo "ERROR=current_review_boundary_lost token=$token" >&2
              exit 1
            }
          done
          grep -F -- '--recovery-dir' "$WORKFLOW_CANDIDATE" >/dev/null
          grep -F -- 'Upload apply recovery manifest' "$WORKFLOW_CANDIDATE" >/dev/null
          grep -F -- 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' "$WORKFLOW_CANDIDATE" >/dev/null
          grep -F -- 'if-no-files-found: error' "$WORKFLOW_CANDIDATE" >/dev/null

          mkdir -p "$(dirname "$EVIDENCE_PATH")"
          cat >"$EVIDENCE_PATH" <<EOF
          # Keycloak transaction-safety port

          Date: 2026-09-03

          ## Exact authority

          \`\`\`text
          reconciled_authority_sha=$AUTHORITY_SHA
          original_pr=16
          resolved_source_parent_sha=$SOURCE_PARENT_SHA
          resolved_source_sha=$SOURCE_SHA
          target_branch=$TARGET_BRANCH
          port_method=per-file three-way merge of final resolved PR tree
          workflow_candidate=$WORKFLOW_CANDIDATE
          \`\`\`

          ## Controls retained

          - every update target is re-fetched immediately before its PUT;
          - the reviewed managed-shape hash is recomputed against the immediate live state;
          - unmanaged concurrent fields are preserved by rebuilding from immediate live state;
          - an absolute, non-symlink recovery directory is mandatory;
          - the recovery manifest exists before the first mutation and is updated atomically;
          - operation events record pending, started, created, updated, unchanged, failed,
            rollback-required, and rollback-completed states;
          - a failure after any mutation emits \`PARTIAL_APPLY=true\` and retains exact
            rollback evidence;
          - recovery evidence is uploaded with \`always()\` on protected apply runs;
          - current independent review-file and review-hash gates remain mandatory.

          The deploy workflow is temporarily stored under \`docs/evidence\` because the
          ephemeral GitHub workflow token cannot publish workflow-file changes. The
          repository connector must copy the validated candidate to the permanent deploy
          workflow, delete the candidate, and rerun exact-head checks.

          ## Safety

          \`\`\`text
          KEYCLOAK_RUNTIME_CONTACTED=false
          KEYCLOAK_RUNTIME_APPLY=false
          REALMS_CHANGED=0
          CLIENTS_CHANGED=0
          USERS_CHANGED=0
          SECRETS_READ=0
          SECRETS_WRITTEN=0
          TOKENS_ISSUED=0
          SSH_CHANGED=false
          PRODUCTION_RUNTIME_CHANGED=false
          \`\`\`
          EOF
          sed -i 's/^          //' "$EVIDENCE_PATH"

          sudo apt-get update
          sudo apt-get install --yes jq shellcheck openssh-client python3-yaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('docs/evidence/KEYCLOAK_DEPLOY_TRANSACTION_SAFETY_CANDIDATE.yml')
          data = yaml.safe_load(path.read_text(encoding='utf-8'))
          if not isinstance(data, dict) or 'jobs' not in data:
              raise SystemExit('invalid deploy workflow candidate')
          print('DEPLOY_WORKFLOW_CANDIDATE=PASS')
          PY
          python3 -m compileall -q scripts tests
          ./scripts/validate.sh
          TEST_KC_CLIENT_SECRET=test-only-secret ./scripts/test-plan-gate.sh
          ./scripts/test-runtime-preflight.sh
          shellcheck scripts/*.sh scripts/lib/*.sh
          git diff --check

          git add -- \
            Makefile \
            README.md \
            docs/GITOPS.md \
            docs/audits/KEYCLOAK_BASELINE_AUDIT.md \
            docs/evidence/KEYCLOAK_DEPLOY_TRANSACTION_SAFETY_CANDIDATE.yml \
            docs/governance/KEYCLOAK_TRANSACTION_SAFETY_PORT_2026-09-03.md \
            scripts/apply-plan.sh \
            scripts/test-plan-gate.sh
          git diff --cached --check
          git config user.name 'codestra-keycloak-transaction-safety'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(keycloak): port transaction-safe recoverable apply'
          target_sha="$(git rev-parse HEAD)"
          [[ "$(git rev-parse HEAD^)" == "$AUTHORITY_SHA" ]] || {
            echo 'ERROR=unexpected_target_parent' >&2
            exit 1
          }
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          [[ "$remote_sha" == "$target_sha" ]] || {
            echo "ERROR=remote_readback_mismatch expected=$target_sha actual=$remote_sha" >&2
            exit 1
          }
          echo 'KEYCLOAK_TRANSACTION_SAFETY_PORT=PASS'
          echo "TARGET_SHA=$target_sha"
          echo 'KEYCLOAK_RUNTIME_APPLY=false'
          echo 'SECRETS_READ=0'
          echo 'SSH_CHANGED=false'
