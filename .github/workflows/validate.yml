name: Validate Keycloak GitOps

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: keycloak-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck

      - name: Validate desired state and scripts
        run: ./scripts/validate.sh

      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: ${{ format('ci-only-{0}', github.run_id) }}
          KC_BOOTSTRAP_ADMIN_USERNAME: ci-bootstrap-admin
          KC_BOOTSTRAP_ADMIN_PASSWORD: ${{ format('ci-only-{0}', github.run_id) }}
        run: docker compose config --quiet

      - name: Build optimized Keycloak image
        run: |
          docker build \
            --build-arg KEYCLOAK_VERSION=26.7.2 \
            --tag codestra-keycloak:${{ github.sha }} \
            .
