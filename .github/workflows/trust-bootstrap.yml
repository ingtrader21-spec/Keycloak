name: Independent trust bootstrap

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  bootstrap-tests:
    name: trust-bootstrap-tests
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - run: python3 -m unittest discover -s tests -p test_trust_bootstrap.py -v

  trusted-observation:
    name: trusted-source-observation
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out only the protected base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Read candidate Git objects without executing candidate code
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/trust-root/verify.py
      - name: Preserve non-authorizing observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: keycloak-trust-observation
          path: ${{ runner.temp }}/keycloak-trust-observation.json
          if-no-files-found: error
          retention-days: 7
