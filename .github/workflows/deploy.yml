name: Deploy Keycloak configuration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub Environment
        required: true
        type: choice
        options:
          - staging
          - production
      mode:
        description: Check drift or apply the reviewed desired state
        required: true
        type: choice
        default: check
        options:
          - check
          - apply

permissions:
  contents: read

concurrency:
  group: keycloak-config-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64, codestra-keycloak]
    environment: ${{ inputs.environment }}
    timeout-minutes: 15

    env:
      KC_BASE_URL: ${{ vars.KC_BASE_URL }}
      KC_PUBLIC_URL: ${{ vars.KC_PUBLIC_URL }}
      KC_TARGET_REALM: ${{ vars.KC_TARGET_REALM }}
      KC_ADMIN_REALM: ${{ vars.KC_ADMIN_REALM }}
      KC_ADMIN_CLIENT_ID: ${{ secrets.KC_ADMIN_CLIENT_ID }}
      KC_ADMIN_CLIENT_SECRET: ${{ secrets.KC_ADMIN_CLIENT_SECRET }}

    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@v4

      - name: Validate desired state
        run: ./scripts/validate.sh

      - name: Export sanitized pre-change clients
        if: ${{ inputs.mode == 'apply' }}
        run: |
          mapfile -t clients < <(jq -r '.clientId' config/clients/*.json)
          ./scripts/export-client.sh --output "$RUNNER_TEMP/keycloak-before" "${clients[@]}"

      - name: Upload rollback snapshot
        if: ${{ inputs.mode == 'apply' }}
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-before-${{ inputs.environment }}-${{ github.sha }}
          path: ${{ runner.temp }}/keycloak-before
          if-no-files-found: error
          retention-days: 30

      - name: Check drift
        if: ${{ inputs.mode == 'check' }}
        run: ./scripts/reconcile.sh --check

      - name: Apply desired state
        if: ${{ inputs.mode == 'apply' }}
        run: ./scripts/reconcile.sh --apply

      - name: Run read-only OIDC smoke test
        if: ${{ inputs.mode == 'apply' }}
        run: ./scripts/smoke-test.sh
