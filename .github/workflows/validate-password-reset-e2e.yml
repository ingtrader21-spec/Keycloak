name: Validate password reset acceptance policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: password-reset-e2e-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate-source-e2e:
    name: validate-source-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}
      - name: Verify source identity
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
      - name: Validate protected staging acceptance policy
        run: python3 scripts/validate-password-reset-e2e.py

  validate-merge-result-e2e:
    name: validate-merge-result-e2e
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact merge-result SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}
      - name: Verify merge-result identity
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
      - name: Validate protected staging acceptance policy
        run: python3 scripts/validate-password-reset-e2e.py
