name: Verify Keycloak runtime paths

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub Environment containing reviewed runtime variables
        required: true
        type: choice
        options: [staging, production]
      confirm_sha:
        description: Paste the exact 40-character main SHA to inspect
        required: true
        type: string
  push:
    branches: [ops/stage6-intake-observability-execution-20260830]
    paths: [config/executions/stage6-intake-observability.v1.json]

permissions:
  contents: read
  packages: read

concurrency:
  group: keycloak-runtime-preflight-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  guard:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out selected main commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require reviewed main and exact confirmation
        env:
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$CONFIRM_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONFIRM_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          ./scripts/validate.sh

  inspect:
    if: github.event_name == 'workflow_dispatch'
    needs: guard
    runs-on: [self-hosted, linux, x64, codestra-keycloak]
    environment: ${{ inputs.environment }}
    timeout-minutes: 10
    env:
      RUNTIME_REPO_DIR: ${{ vars.RUNTIME_REPO_DIR }}
      RUNTIME_COMPOSE_FILE: ${{ vars.RUNTIME_COMPOSE_FILE }}
      RUNTIME_ENV_FILE: ${{ vars.RUNTIME_ENV_FILE }}
      RUNTIME_CADDY_FILE: ${{ vars.RUNTIME_CADDY_FILE }}
      RUNTIME_GIT_SSH_KEY: ${{ vars.RUNTIME_GIT_SSH_KEY }}
      RUNTIME_GIT_KNOWN_HOSTS: ${{ vars.RUNTIME_GIT_KNOWN_HOSTS }}
      RUNTIME_GIT_REMOTE: ${{ vars.RUNTIME_GIT_REMOTE }}
      RUNTIME_GIT_BRANCH: ${{ vars.RUNTIME_GIT_BRANCH }}
    steps:
      - name: Check out reviewed commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Run read-only runtime preflight
        run: |
          set -Eeuo pipefail
          ./scripts/runtime-preflight.sh \
            --expected-deploy-sha "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/keycloak-runtime-preflight.txt"
      - name: Upload redacted preflight evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: keycloak-runtime-preflight-${{ inputs.environment }}-${{ github.sha }}
          path: ${{ runner.temp }}/keycloak-runtime-preflight.txt
          if-no-files-found: error
          retention-days: 30

  stage6-intake-observability:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/stage6-intake-observability-execution-20260830'
    runs-on: [self-hosted, linux, x64, codestra-keycloak]
    environment: staging
    timeout-minutes: 60
    env:
      KC_BASE_URL: ${{ vars.KC_BASE_URL }}
      KC_PUBLIC_URL: ${{ vars.KC_PUBLIC_URL }}
      KC_TARGET_REALM: ${{ vars.KC_TARGET_REALM }}
      KC_ADMIN_REALM: ${{ vars.KC_ADMIN_REALM }}
      KC_ADMIN_CLIENT_ID: ${{ secrets.KC_ADMIN_CLIENT_ID }}
      KC_ADMIN_CLIENT_SECRET: ${{ secrets.KC_ADMIN_CLIENT_SECRET }}
      CODESTRA_STAGING_ROOT: ${{ vars.STAGE6_INTAKE_OBSERVABILITY_ROOT }}
      GHCR_USERNAME: ${{ secrets.CODESTRA_GHCR_USERNAME || github.actor }}
      GHCR_TOKEN: ${{ secrets.CODESTRA_GHCR_DEPLOYMENT_READ_TOKEN || github.token }}
      EXECUTION_LOCK: config/executions/stage6-intake-observability.v1.json
      INFRASTRUCTURE_SHA: 61787bd39515b775ba6b22c3e7af5862b44b3dad
      PROMETHEUS_SHA: 4230ec1c398db69e8ca95848135b13dd84e03c94
      OPENBAO_SHA: 2c199ee38ce372af4e0355c83e018f417e3afc8f
      MIDDLEWARE_SOURCE_SHA: f6748a58f8d2590520a4f28776770957061cdea1
      MIDDLEWARE_IMAGE_DIGEST: sha256:695fa3ce3f50ba4d0ae0784976b946a0a683ca731155e4bd3bd9e90a4670b820
      MIDDLEWARE_IMAGE_REFERENCE: ghcr.io/appolon1908-hue/codestra-middleware@sha256:695fa3ce3f50ba4d0ae0784976b946a0a683ca731155e4bd3bd9e90a4670b820
      COLLECTOR_IMAGE: python:3.13.15-slim-bookworm@sha256:00faa2debb87529f9f0764e9491d8ba400a3678976616c3bd7cb193745ac20d1
    steps:
      - name: Check out exact Stage 6 execution commit and parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Pin Python 3.10 reconciliation runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Verify Python 3.10 reconciliation runtime
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 10), sys.version'
      - name: Enforce exact execution authority and staging-only boundary
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2 ]]
          main_sha="$(git rev-parse HEAD^)"
          jq -e \
            --arg mainSha "$main_sha" \
            --arg infrastructureSha "$INFRASTRUCTURE_SHA" \
            --arg prometheusSha "$PROMETHEUS_SHA" \
            --arg openbaoSha "$OPENBAO_SHA" \
            --arg sourceSha "$MIDDLEWARE_SOURCE_SHA" \
            --arg imageDigest "$MIDDLEWARE_IMAGE_DIGEST" '
              .schema_version == "1.0"
              and .execution_id == "CHG-20260830-STAGE6-INTAKE-OBSERVABILITY-01"
              and .environment == "staging"
              and .keycloak_main_sha == $mainSha
              and .infrastructure_sha == $infrastructureSha
              and .prometheus_sha == $prometheusSha
              and .openbao_sha == $openbaoSha
              and .middleware_source_sha == $sourceSha
              and .middleware_image_digest == $imageDigest
              and .prometheus_target_state == "pending"
              and .blackbox_target_state == "pending"
              and .external_effects_enabled == false
              and .production_authorized == false
              and (.execution_reason | type == "string" and length >= 40)
            ' "$EXECUTION_LOCK" >/dev/null
          stage6_root="${CODESTRA_STAGING_ROOT:-$HOME/.local/share/codestra/staging/intake-observability}"
          [[ "$stage6_root" == /* && "$stage6_root" != / && "$stage6_root" != /etc && "$stage6_root" != /opt && "$stage6_root" != /srv ]]
          echo "STAGE6_ROOT=$stage6_root" >>"$GITHUB_ENV"
          echo 'environment staging'
          echo 'PROMETHEUS_TARGET_STATE=pending'
          echo 'BLACKBOX_TARGET_STATE=pending'
      - name: Require protected staging identity inputs before any deployment
        run: |
          set -Eeuo pipefail
          for name in KC_BASE_URL KC_PUBLIC_URL KC_TARGET_REALM KC_ADMIN_REALM KC_ADMIN_CLIENT_ID KC_ADMIN_CLIENT_SECRET CODESTRA_STAGING_ROOT; do
            [[ -n "${!name:-}" ]] || { echo "ERROR=missing_protected_staging_input:${name}" >&2; exit 1; }
          done
          [[ "$KC_BASE_URL" == 'https://auth-staging.codestra.co' ]] || { echo 'ERROR=kc_base_url_must_be_canonical_staging_https' >&2; exit 1; }
          [[ "$KC_PUBLIC_URL" == 'https://auth-staging.codestra.co' ]] || { echo 'ERROR=kc_public_url_must_be_canonical_staging_https' >&2; exit 1; }
          [[ "$KC_TARGET_REALM" == 'codestra' ]] || { echo 'ERROR=kc_target_realm_must_be_codestra' >&2; exit 1; }
          [[ "$KC_ADMIN_REALM" == 'master' ]] || { echo 'ERROR=kc_admin_realm_must_be_master' >&2; exit 1; }
      - name: Check out exact merged Infrastructure authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: appolon1908-hue/Infustruction-repo
          fetch-depth: 1
          persist-credentials: false
          ref: 61787bd39515b775ba6b22c3e7af5862b44b3dad
          path: stage6-infrastructure
      - name: Check out exact merged Prometheus authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: appolon1908-hue/Codestra-Prometheus
          fetch-depth: 1
          persist-credentials: false
          ref: 4230ec1c398db69e8ca95848135b13dd84e03c94
          path: stage6-prometheus
      - name: Check out exact merged OpenBao authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: appolon1908-hue/Codestra-OpenBao
          fetch-depth: 1
          persist-credentials: false
          ref: 2c199ee38ce372af4e0355c83e018f417e3afc8f
          path: stage6-openbao
      - name: Verify exact cross-repository source locks
        run: |
          set -Eeuo pipefail
          [[ "$(git -C stage6-infrastructure rev-parse HEAD)" == "$INFRASTRUCTURE_SHA" ]]
          [[ "$(git -C stage6-prometheus rev-parse HEAD)" == "$PROMETHEUS_SHA" ]]
          [[ "$(git -C stage6-openbao rev-parse HEAD)" == "$OPENBAO_SHA" ]]
          python3 scripts/validate_stage6_intake_observability_source.py
          python3 stage6-openbao/codestra/runtime-v1/validate_monitoring_staging_token_control.py
          jq -e --arg digest "$MIDDLEWARE_IMAGE_DIGEST" '
            .middleware.image_digest == $digest
            and .identity.public_url == "https://auth-staging.codestra.co"
            and .identity.production_identity_endpoint_allowed == false
            and .activation.prometheus_target == "pending"
            and .activation.blackbox_target == "pending"
            and .external_effects_enabled == false
          ' stage6-infrastructure/deploy/staging/intake-observability/runtime-lock.v1.json >/dev/null
          jq -e '.[] | select(.labels.service == "middleware-intake") | .labels.activation == "pending" and .labels.environment == "staging"' stage6-prometheus/codestra/prometheus/targets/staging.json >/dev/null
      - name: Authenticate to immutable image registry
        run: |
          set -Eeuo pipefail
          [[ -n "$GHCR_USERNAME" && -n "$GHCR_TOKEN" ]]
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin >/dev/null
      - name: Deploy the exact immutable Middleware digest privately
        run: |
          set -Eeuo pipefail
          KEYCLOAK_PUBLIC_URL="$KC_PUBLIC_URL" KEYCLOAK_REALM="$KC_TARGET_REALM" CODESTRA_STAGING_ROOT="$STAGE6_ROOT" \
            bash stage6-infrastructure/scripts/deploy_intake_observability_staging.sh deploy
      - name: Reconcile monitoring-readonly and issue isolated short-lived tokens
        run: |
          set -Eeuo pipefail
          umask 077
          secret_dir="$RUNNER_TEMP/stage6-monitoring-secrets"
          rm -rf "$secret_dir" && mkdir -m 700 "$secret_dir"
          python3 scripts/reconcile_monitoring_readonly_staging.py --mode apply-and-issue \
            --desired-client config/clients/monitoring-readonly.json --output-dir "$secret_dir"
          echo "STAGE6_SECRET_DIR=$secret_dir" >>"$GITHUB_ENV"
      - name: Run actual GET-only scope-isolated staging evidence collector
        run: |
          set -Eeuo pipefail
          umask 077
          evidence_dir="$RUNNER_TEMP/stage6-intake-evidence"
          rm -rf "$evidence_dir" && mkdir -m 700 "$evidence_dir"
          docker pull "$COLLECTOR_IMAGE" >/dev/null
          echo 'BASE_COLLECTOR=collect_staging_intake_evidence.py'
          docker run --rm --network codestra-intake-observability-staging_private \
            --user "$(id -u):$(id -g)" --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m --cap-drop ALL \
            --security-opt no-new-privileges \
            -v "$GITHUB_WORKSPACE/stage6-prometheus:/source:ro" \
            -v "$STAGE6_SECRET_DIR:/run/evidence-secrets:ro" \
            -v "$evidence_dir:/evidence" "$COLLECTOR_IMAGE" \
            python /source/codestra/scripts/collect_staging_intake_evidence_v2.py \
              --base-url http://middleware-intake-staging:8080 \
              --metrics-token-file /run/evidence-secrets/metrics.token \
              --health-token-file /run/evidence-secrets/health.token \
              --expected-source-sha "$MIDDLEWARE_SOURCE_SHA" \
              --expected-image-digest "$MIDDLEWARE_IMAGE_DIGEST" \
              --output /evidence/staging-intake-evidence.json \
              --checksum-output /evidence/staging-intake-evidence.sha256
          cp "$STAGE6_ROOT/runtime-context.json" "$evidence_dir/runtime-context.json"
          cp "$STAGE6_SECRET_DIR/monitoring-token-evidence.json" "$evidence_dir/monitoring-token-evidence.json"
          cp "$EXECUTION_LOCK" "$evidence_dir/execution-lock.json"
          checksum="$(cat "$evidence_dir/staging-intake-evidence.sha256")"
          [[ "$checksum" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "STAGING_EVIDENCE_CHECKSUM=$checksum" >>"$GITHUB_ENV"
          echo "STAGE6_EVIDENCE_DIR=$evidence_dir" >>"$GITHUB_ENV"
      - name: Upload sanitized staging evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stage6-intake-observability-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.STAGE6_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
      - name: Record passing checksum without activation
        run: |
          set -Eeuo pipefail
          echo "EVIDENCE_CHECKSUM=$STAGING_EVIDENCE_CHECKSUM" >>"$GITHUB_STEP_SUMMARY"
          echo 'PROMETHEUS_TARGET_STATE=pending'
          echo 'BLACKBOX_TARGET_STATE=pending'
          echo 'PRODUCTION_AUTHORIZED=NO'
      - name: Roll back containers on failure while preserving data volumes
        if: failure()
        run: |
          set +e
          if [[ -n "${STAGE6_ROOT:-}" && -f "$STAGE6_ROOT/deployment.env" ]]; then
            CODESTRA_STAGING_ROOT="$STAGE6_ROOT" bash stage6-infrastructure/scripts/deploy_intake_observability_staging.sh rollback
          fi
      - name: Delete raw token and client-secret files
        if: always()
        run: |
          set +e
          if [[ -n "${STAGE6_SECRET_DIR:-}" && -d "$STAGE6_SECRET_DIR" ]]; then
            find "$STAGE6_SECRET_DIR" -type f ! -name monitoring-token-evidence.json -delete
            rm -rf "$STAGE6_SECRET_DIR"
          fi
          docker logout ghcr.io >/dev/null 2>&1 || true
