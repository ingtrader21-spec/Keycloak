name: Repository Name Authority

on:
  pull_request:
    paths:
      - 'config/policy/repository-name-aliases.v1.json'
      - 'scripts/validate-repository-name-authority.py'
      - '.github/workflows/runtime-preflight.yml'
      - '.github/workflows/repository-name-authority.yml'
      - 'docs/REPOSITORY_NAME_MIGRATION.md'
  push:
    branches:
      - main
    paths:
      - 'config/policy/repository-name-aliases.v1.json'
      - 'scripts/validate-repository-name-authority.py'
      - '.github/workflows/runtime-preflight.yml'
      - '.github/workflows/repository-name-authority.yml'
      - 'docs/REPOSITORY_NAME_MIGRATION.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python scripts/validate-repository-name-authority.py
