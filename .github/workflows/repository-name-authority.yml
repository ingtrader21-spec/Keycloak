name: Repository Name Authority

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-name-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate live stable repository identities
        run: python3 scripts/validate-repository-name-authority.py
      - name: Run repository-name authority regression tests
        run: python3 -m unittest discover -s tests -p 'test_repository_name_authority.py' -v
