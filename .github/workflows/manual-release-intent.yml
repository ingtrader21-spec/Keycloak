name: Manual protected release intent

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Normalized portfolio release phase
        required: true
        type: choice
        options: [plan, staging, canary, production]
      source_sha:
        description: Exact protected default-branch head SHA
        required: true
        type: string
      release_id:
        description: Portfolio release identifier
        required: true
        type: string
      candidate_sha256:
        description: Exact portfolio candidate file SHA-256
        required: true
        type: string
      images_json:
        description: JSON array of exact candidate image@sha256 identities
        required: true
        type: string
      previous_images_json:
        description: JSON array of exact rollback image@sha256 identities
        required: true
        type: string
      prior_evidence_sha256:
        description: Exact prior-phase evidence SHA-256, or 64 zeroes for plan
        required: true
        type: string
      confirmation:
        description: Exact phase-specific confirmation
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: manual-release-intent-${{ inputs.phase }}-${{ inputs.release_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: release-intent / exact-head-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      environment: ${{ steps.policy.outputs.environment }}
      deployment_authority: ${{ steps.policy.outputs.deployment_authority }}
      evidence_b64: ${{ steps.policy.outputs.evidence_b64 }}
      evidence_sha256: ${{ steps.policy.outputs.evidence_sha256 }}
    steps:
      - name: Check out exact dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Verify contract, exact branch head, checks, and immutable artifacts
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE: ${{ inputs.phase }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          IMAGES_JSON: ${{ inputs.images_json }}
          PREVIOUS_IMAGES_JSON: ${{ inputs.previous_images_json }}
          PRIOR_EVIDENCE_SHA256: ${{ inputs.prior_evidence_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import base64, hashlib, json, os, re, subprocess
          from pathlib import Path
          contract_path = Path('.codestra/production-orchestrator-contract.v1.json')
          confirmations = {'plan':'PLAN_RELEASE_INTENT','staging':'APPROVE_STAGING_INTENT','canary':'APPROVE_CANARY_INTENT','production':'APPROVE_PRODUCTION_INTENT'}
          safety_keys = {'external_effects_default','live_email_delivery','live_sms_delivery','live_pstn_dialing','odoo_write','n8n_external_delivery','live_trading','payment_execution'}
          sha_re = re.compile(r'^[0-9a-f]{40}$'); digest_re = re.compile(r'^[0-9a-f]{64}$'); release_re = re.compile(r'^[A-Za-z0-9][A-Za-z0-9._-]{5,127}$'); image_re = re.compile(r'^ghcr\.io/[a-z0-9_.-]+/[a-z0-9_.-]+@sha256:[0-9a-f]{64}$')
          def require(value, message):
              if not value: raise SystemExit(message)
          phase=os.environ['PHASE']; source_sha=os.environ['SOURCE_SHA']; release_id=os.environ['RELEASE_ID']; candidate_sha256=os.environ['CANDIDATE_SHA256']; prior_sha256=os.environ['PRIOR_EVIDENCE_SHA256']
          require(phase in confirmations and os.environ['CONFIRMATION']==confirmations[phase], 'phase confirmation mismatch')
          require(sha_re.fullmatch(source_sha) and source_sha!='0'*40, 'invalid source SHA')
          require(digest_re.fullmatch(candidate_sha256) and candidate_sha256!='0'*64, 'invalid candidate digest')
          require(digest_re.fullmatch(prior_sha256), 'invalid prior evidence digest')
          require(release_re.fullmatch(release_id), 'invalid release ID')
          require(prior_sha256=='0'*64 if phase=='plan' else prior_sha256!='0'*64, 'prior evidence policy mismatch')
          require(contract_path.is_file() and not contract_path.is_symlink(), 'contract missing or unsafe')
          contract_bytes=contract_path.read_bytes(); contract=json.loads(contract_bytes)
          require(contract.get('schema_version')=='codestra.production-orchestrator-contract.v1','contract schema mismatch')
          require(contract.get('repository')==os.environ['GITHUB_REPOSITORY'],'contract repository mismatch')
          require(contract.get('release_intent_workflow')=='.github/workflows/manual-release-intent.yml','contract workflow mismatch')
          require(contract.get('default_branch')==os.environ['GITHUB_REF_NAME'],'default branch mismatch')
          require(os.environ['GITHUB_REF']==f"refs/heads/{contract['default_branch']}",'dispatch ref mismatch')
          require(subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source_sha,'checkout SHA mismatch')
          require(not subprocess.check_output(['git','status','--porcelain'],text=True).strip(),'dirty workspace')
          repo=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}"],text=True))
          require(repo.get('id')==contract.get('repository_id'),'stable repository ID mismatch')
          require(repo.get('default_branch')==contract.get('default_branch'),'repository default branch drift')
          require(repo.get('archived') is False and repo.get('disabled') is False,'repository unavailable')
          branch=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/branches/{contract['default_branch']}"],text=True))
          require(branch.get('protected') is True,'default branch must be protected')
          require(branch.get('commit',{}).get('sha')==source_sha,'source is not exact protected head')
          supported=contract.get('supported_phases'); require(isinstance(supported,list) and phase in supported,'phase not supported')
          deployment_authority=contract.get('deployment_authority') is True; require(phase=='plan' or deployment_authority,'repository is not a deployment authority')
          required=contract.get('required_checks'); require(isinstance(required,list) and all(isinstance(x,str) and x for x in required),'invalid required checks')
          branch_contexts=branch.get('protection',{}).get('required_status_checks',{}).get('contexts',[]); require(isinstance(branch_contexts,list),'invalid branch check list')
          required=sorted(set(required)|set(branch_contexts)); require(required,'at least one exact-head check is required')
          runs=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{source_sha}/check-runs?per_page=100"],text=True)).get('check_runs',[])
          latest={}
          for row in sorted(runs,key=lambda x:x.get('completed_at') or x.get('started_at') or ''):
              if isinstance(row.get('name'),str): latest[row['name']]=row.get('conclusion')
          statuses=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{source_sha}/status"],text=True)).get('statuses',[])
          status_by_name={}
          for row in statuses:
              if isinstance(row.get('context'),str) and row['context'] not in status_by_name: status_by_name[row['context']]=row.get('state')
          missing=[name for name in required if latest.get(name)!='success' and status_by_name.get(name)!='success']; require(not missing,f'required exact-head checks not successful: {missing}')
          if contract.get('require_verified_commit') is True:
              commit=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{source_sha}"],text=True)); require(commit.get('commit',{}).get('verification',{}).get('verified') is True,'source commit is not GitHub-verified')
          try: images=json.loads(os.environ['IMAGES_JSON']); previous=json.loads(os.environ['PREVIOUS_IMAGES_JSON'])
          except json.JSONDecodeError as error: raise SystemExit(f'invalid image JSON: {error}')
          require(isinstance(images,list) and isinstance(previous,list),'image inputs must be arrays')
          require(all(isinstance(x,str) and image_re.fullmatch(x) for x in images),'candidate image must be exact GHCR digest')
          require(all(isinstance(x,str) and image_re.fullmatch(x) for x in previous),'rollback image must be exact GHCR digest')
          require(len(images)==len(set(images)) and len(previous)==len(set(previous)),'duplicate image identity')
          policy=contract.get('artifact_policy'); require(isinstance(policy,dict),'artifact policy missing'); minimum,maximum=policy.get('minimum_images'),policy.get('maximum_images')
          require(isinstance(minimum,int) and isinstance(maximum,int) and 0<=minimum<=maximum,'invalid image bounds')
          require(minimum<=len(images)<=maximum,'candidate image count violates contract'); require(len(previous)==len(images),'rollback image count mismatch'); require(not images or images!=previous,'rollback images must differ from candidate')
          require(policy.get('require_digest') is True and policy.get('allow_rebuild_after_staging') is False and policy.get('allow_retag_after_staging') is False,'immutable artifact policy mismatch')
          safety=contract.get('safety'); require(isinstance(safety,dict) and safety_keys<=set(safety),'safety contract incomplete')
          for key in safety_keys: require(safety.get(key) is False,f'{key} must remain false')
          environment=''
          if phase!='plan':
              environment=contract.get('environments',{}).get(phase,''); expected={'staging':'staging-readonly','canary':'production-readonly-canary','production':'production'}[phase]; require(environment==expected,'protected environment mismatch')
          evidence={'schema_version':'codestra.normalized-release-intent.v1','repository':os.environ['GITHUB_REPOSITORY'],'repository_id':contract['repository_id'],'role':contract['role'],'phase':phase,'release_id':release_id,'source_sha':source_sha,'candidate_sha256':candidate_sha256,'prior_evidence_sha256':prior_sha256,'contract_sha256':hashlib.sha256(contract_bytes).hexdigest(),'required_checks':required,'candidate_images':images,'previous_images':previous,'deployment_authority':deployment_authority,'protected_environment':environment or None,'protected_environment_approved':False,'runtime_contacted':False,'production_changed':False,'external_effects_enabled':False,'status':'PASS'}
          encoded=json.dumps(evidence,sort_keys=True,separators=(',',':')).encode()
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'environment={environment}\n'); output.write(f'deployment_authority={str(deployment_authority).lower()}\n'); output.write(f'evidence_b64={base64.b64encode(encoded).decode()}\n'); output.write(f'evidence_sha256={hashlib.sha256(encoded).hexdigest()}\n')
          PY

  plan-intent:
    name: release-intent / plan
    needs: [verify]
    if: ${{ inputs.phase == 'plan' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Materialize verified plan intent
        env:
          EVIDENCE_B64: ${{ needs.verify.outputs.evidence_b64 }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.evidence_sha256 }}
        run: |
          set -Eeuo pipefail
          umask 077
          printf '%s' "$EVIDENCE_B64" | base64 --decode > "$RUNNER_TEMP/release-intent.json"
          test "$(sha256sum "$RUNNER_TEMP/release-intent.json" | cut -d' ' -f1)" = "$EXPECTED_SHA256"
          jq -e '.phase == "plan" and .protected_environment == null and .production_changed == false and .external_effects_enabled == false and .status == "PASS"' "$RUNNER_TEMP/release-intent.json" >/dev/null
      - name: Upload normalized release intent
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: codestra-release-intent-${{ inputs.phase }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-intent.json
          if-no-files-found: error
          retention-days: 30

  protected-intent:
    name: release-intent / protected-${{ inputs.phase }}
    needs: [verify]
    if: ${{ inputs.phase != 'plan' && needs.verify.outputs.deployment_authority == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ needs.verify.outputs.environment }}
    steps:
      - name: Re-verify exact protected branch head after approval
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -Eeuo pipefail
          branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" --jq .commit.sha)" = "$SOURCE_SHA"
      - name: Materialize environment-approved intent
        env:
          EVIDENCE_B64: ${{ needs.verify.outputs.evidence_b64 }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.evidence_sha256 }}
          EXPECTED_ENVIRONMENT: ${{ needs.verify.outputs.environment }}
        run: |
          set -Eeuo pipefail
          umask 077
          printf '%s' "$EVIDENCE_B64" | base64 --decode > "$RUNNER_TEMP/release-intent.unapproved.json"
          test "$(sha256sum "$RUNNER_TEMP/release-intent.unapproved.json" | cut -d' ' -f1)" = "$EXPECTED_SHA256"
          jq --arg environment "$EXPECTED_ENVIRONMENT" 'if .protected_environment != $environment or .production_changed != false or .external_effects_enabled != false or .status != "PASS" then error("release intent evidence mismatch") else .protected_environment_approved = true end' "$RUNNER_TEMP/release-intent.unapproved.json" > "$RUNNER_TEMP/release-intent.json"
          jq -e '.protected_environment_approved == true and .runtime_contacted == false and .production_changed == false and .external_effects_enabled == false' "$RUNNER_TEMP/release-intent.json" >/dev/null
      - name: Upload normalized protected release intent
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: codestra-release-intent-${{ inputs.phase }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-intent.json
          if-no-files-found: error
          retention-days: 30
