name: Keycloak release trust root

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # During this bootstrap PR the implementation is not yet present on
          # main. After merge, the workflow is protected-main-owned and the
          # checkout resolves to the protected workflow's own revision.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify protected-main bootstrap
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$CANDIDATE_SHA" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 scripts/bootstrap_release_trust_root.py \
            --candidate-sha "$CANDIDATE_SHA" \
            --expected-candidate-sha "$CANDIDATE_SHA"
