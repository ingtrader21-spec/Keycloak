name: One-shot audit of open Keycloak pull requests

on:
  push:
    branches:
      - remediation/open-pr-reconciliation-20260903
    paths:
      - scripts/ci/audit_open_pull_requests.py
      - .github/workflows/one-shot-open-pr-reconciliation.yml

permissions:
  contents: write
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: keycloak-open-pr-reconciliation-20260903
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_MAIN_SHA: 3d8cd0483a178100b679b2c3f0f4d4ca36fe161c
      AUDIT_BRANCH: remediation/open-pr-reconciliation-20260903
    steps:
      - name: Check out exact audit trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Set up supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Prove immutable main and exact trigger
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_REF_NAME" == "$AUDIT_BRANCH" ]]
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$EXPECTED_MAIN_SHA" ]] || {
            echo 'ERROR=main_moved_since_audit_authorization' >&2
            exit 1
          }
          python3 -m py_compile scripts/ci/audit_open_pull_requests.py

      - name: Audit all live pull requests against exact main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/audit_open_pull_requests.py

      - name: Validate generated evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          report_json=docs/audits/KEYCLOAK_OPEN_PR_RECONCILIATION_2026-09-03.json
          report_md=docs/audits/KEYCLOAK_OPEN_PR_RECONCILIATION_2026-09-03.md
          [[ -s "$report_json" && -s "$report_md" ]]
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/audits/KEYCLOAK_OPEN_PR_RECONCILIATION_2026-09-03.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['schema_version'] == 1
          assert data['repository'] == 'appolon1908-hue/Keycloak'
          assert data['expected_main_sha'] == '3d8cd0483a178100b679b2c3f0f4d4ca36fe161c'
          assert len(data['pull_requests']) == 18, len(data['pull_requests'])
          assert data['safety'] == {
              'keycloak_runtime_contacted': False,
              'keycloak_runtime_apply': False,
              'secrets_read': 0,
              'tokens_issued': 0,
              'prs_merged': 0,
              'ssh_changed': False,
              'production_changed': False,
          }
          numbers = [item['number'] for item in data['pull_requests']]
          assert len(numbers) == len(set(numbers))
          base_refs = sorted({item['base_ref'] for item in data['pull_requests']})
          assert base_refs and all(base_refs)
          assert 'main' in base_refs
          print(f"KEYCLOAK_OPEN_PR_BASE_REFS={','.join(base_refs)}")
          print('KEYCLOAK_OPEN_PR_EVIDENCE=PASS')
          PY

      - name: Commit only sanitized evidence and remove one-shot writer
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow=.github/workflows/one-shot-open-pr-reconciliation.yml
          auditor=scripts/ci/audit_open_pull_requests.py
          git rm -- "$workflow" "$auditor"
          git add -- \
            docs/audits/KEYCLOAK_OPEN_PR_RECONCILIATION_2026-09-03.md \
            docs/audits/KEYCLOAK_OPEN_PR_RECONCILIATION_2026-09-03.json
          git diff --cached --check
          python3 - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/one-shot-open-pr-reconciliation.yml',
              'scripts/ci/audit_open_pull_requests.py',
              'docs/audits/KEYCLOAK_OPEN_PR_RECONCILIATION_2026-09-03.md',
              'docs/audits/KEYCLOAK_OPEN_PR_RECONCILIATION_2026-09-03.json',
          }
          staged = {
              raw.decode('utf-8')
              for raw in subprocess.check_output(
                  ['git', 'diff', '--cached', '--name-only', '-z']
              ).split(b'\0')
              if raw
          }
          if staged != expected:
              raise SystemExit(
                  f'audit staged-path boundary failed: expected={sorted(expected)} actual={sorted(staged)}'
              )
          PY
          git config user.name 'codestra-keycloak-pr-auditor'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record exact-main Keycloak pull request reconciliation'
          git push origin "HEAD:refs/heads/${AUDIT_BRANCH}"
