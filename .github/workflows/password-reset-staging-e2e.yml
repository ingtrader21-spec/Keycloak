name: Password reset staging acceptance

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Reserved confirmation; live password-reset execution is disabled
        required: true
        type: string
      expected_keycloak_sha:
        description: Exact reviewed Keycloak SHA deployed to staging
        required: true
        type: string
      expected_klyrow_sha:
        description: Exact reviewed Klyrow SHA deployed to staging
        required: true
        type: string
      keycloak_client_id:
        description: Reviewed public PKCE client used by the test
        required: true
        default: klyrow-portal
        type: string
      keycloak_redirect_uri:
        description: Exact reviewed redirect URI
        required: true
        default: https://klyrow.com/
        type: string

permissions:
  contents: read

concurrency:
  group: password-reset-staging-acceptance
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  acceptance:
    # RUNTIME_MUTATION_DISABLED=true
    # This task only prepares repository evidence; the acceptance job creates
    # a Keycloak user and sends a real password-reset email.
    if: ${{ false }}
    name: password-reset-staging-acceptance
    runs-on: [self-hosted, linux, x64, codestra-staging]
    environment: password-reset-staging
    timeout-minutes: 25
    env:
      KEYCLOAK_ISSUER: https://auth.codestra.co/realms/codestra
      KEYCLOAK_CLIENT_ID: ${{ inputs.keycloak_client_id }}
      KEYCLOAK_REDIRECT_URI: ${{ inputs.keycloak_redirect_uri }}
      EXPECTED_KEYCLOAK_SHA: ${{ inputs.expected_keycloak_sha }}
      EXPECTED_KLYROW_SHA: ${{ inputs.expected_klyrow_sha }}
      KEYCLOAK_VERSION_URL: ${{ vars.KEYCLOAK_VERSION_URL }}
      KLYROW_VERSION_URL: ${{ vars.KLYROW_VERSION_URL }}
      KEYCLOAK_E2E_ADMIN_CLIENT_ID: ${{ secrets.KEYCLOAK_E2E_ADMIN_CLIENT_ID }}
      KEYCLOAK_E2E_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_E2E_ADMIN_CLIENT_SECRET }}
      E2E_RECIPIENT_TEMPLATE: ${{ secrets.E2E_RECIPIENT_TEMPLATE }}
      E2E_IMAP_HOST: ${{ secrets.E2E_IMAP_HOST }}
      E2E_IMAP_PORT: ${{ vars.E2E_IMAP_PORT }}
      E2E_IMAP_USERNAME: ${{ secrets.E2E_IMAP_USERNAME }}
      E2E_IMAP_PASSWORD: ${{ secrets.E2E_IMAP_PASSWORD }}
      E2E_IMAP_MAILBOX: ${{ vars.E2E_IMAP_MAILBOX }}
      E2E_IMAP_STARTTLS: ${{ vars.E2E_IMAP_STARTTLS }}
      E2E_POSTAL_RECEIVED_MARKER: ${{ vars.E2E_POSTAL_RECEIVED_MARKER }}
      KLYROW_E2E_DATABASE_URL: ${{ secrets.KLYROW_E2E_DATABASE_URL }}
      KLYROW_E2E_MESSAGE_TABLE: ${{ vars.KLYROW_E2E_MESSAGE_TABLE }}
      MIDDLEWARE_E2E_AUDIT_URL: ${{ vars.MIDDLEWARE_E2E_AUDIT_URL }}
      MIDDLEWARE_E2E_AUDIT_TOKEN: ${{ secrets.MIDDLEWARE_E2E_AUDIT_TOKEN }}
      E2E_EXPIRY_LIFESPAN_SECONDS: '60'
      E2E_EXPIRY_GRACE_SECONDS: '8'
      E2E_MAILBOX_TIMEOUT_SECONDS: '180'
      E2E_REQUEST_TIMEOUT_SECONDS: '20'

    steps:
      - name: Check out exact protected workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify protected workflow identity and inputs
        env:
          CONTROL_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$CONTROL_SHA" ]]
          [[ "$EXPECTED_KEYCLOAK_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_KLYROW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$KEYCLOAK_REDIRECT_URI" == https://* ]]
          [[ "$KEYCLOAK_CLIENT_ID" =~ ^[a-z0-9][a-z0-9._-]{2,127}$ ]]
          install -d -m 0700 evidence .venv

      - name: Install isolated acceptance dependencies
        run: |
          set -Eeuo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir \
            requests==2.34.2 \
            beautifulsoup4==4.13.5 \
            'psycopg[binary]==3.2.9'

      - name: Execute gates 1 through 11
        run: |
          set -Eeuo pipefail
          umask 077
          .venv/bin/python scripts/password-reset-e2e.py \
            --report evidence/password-reset-e2e.json

      - name: Preserve credential-free acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: password-reset-e2e-${{ github.run_id }}
          path: evidence/password-reset-e2e.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
