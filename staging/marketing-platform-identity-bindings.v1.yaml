schema_version: '1.1'
environment: staging
status: PLAN_DEFINED_NOT_APPLIED
realm_plan:
  source_revision: d455afc9ae1265fac4044ec66a9934b683babae7
  apply_mode: check_then_apply_then_readback
service_clients:
  - codestra-marketing
  - codestra-ai
  - codestra-communication
  - codestra-social
  - middleware-api
  - n8n-automation
  - odoo-integration
required_scopes:
  - marketing.read
  - marketing.write
  - marketing.approve
  - marketing.provider.read
  - ai.generate
  - communication.read
  - communication.send
  - social.read
  - social.write
  - social.publish
positive_bindings:
  - subject: codestra-marketing
    audience: codestra-ai
    allowed_scopes: [ai.generate]
  - subject: codestra-marketing
    audience: codestra-communication
    allowed_scopes: [communication.read, communication.send]
  - subject: codestra-marketing
    audience: codestra-social
    allowed_scopes: [social.read, social.write]
  - subject: middleware-api
    audience: codestra-marketing
    allowed_scopes: [marketing.read, marketing.write]
  - subject: n8n-automation
    audience: middleware-api
    allowed_scopes_source: canonical_service_access_matrix
    direct_downstream_credentials_allowed: false
  - subject: odoo-integration
    audience: middleware-api
    allowed_scopes_source: canonical_service_access_matrix
human_roles:
  - marketing_operator
  - marketing_approver
  - n8n_viewer
  - n8n_operator
  - n8n_admin
negative_tests:
  - subject: n8n-automation
    denied: [marketing.approve, marketing.provider.write, marketing.budget.raise]
  - subject: codestra-ai
    denied: [marketing.approve, marketing.provider.write, marketing.budget.raise, communication.send, social.publish]
  - subject: codestra-social
    denied: [marketing.provider.write, marketing.budget.raise]
  - subject: codestra-communication
    denied: [marketing.approve, marketing.provider.write]
readback_requirements:
  - client IDs match canonical managed-client identifiers
  - positive subject/audience/scope bindings match plan
  - service accounts enabled only where required
  - scopes/audiences match plan
  - no embedded secrets in repository
  - actual forbidden scopes cannot be obtained by n8n or AI
  - staging identities cannot obtain production-only roles
production_apply: false
